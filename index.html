<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Шлях Козака: Крізь Віки</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="rotate-warning">
        <div class="warning-box">
            <h2>⚔️ Поверніть телефон горизонтально</h2>
            <p>Козацька шабля любить простір!</p>
        </div>
    </div>

    <div id="main-menu" class="overlay">
        <div class="parchment">
            <h1>⚔️ Шлях Козака ⚔️</h1>
            <p class="subtitle">Хроніки української звитяги (2.5D Платформер)</p>
            <div class="epoch-select">
                <button onclick="startGame(0)">I. Запорозька Січ (1556)</button>
                <button onclick="startGame(1)">II. Хмельниччина (1648)</button>
                <button onclick="startGame(2)">III. Руїна та Мазепа (1709)</button>
                <button onclick="startGame(3)">IV. Холодний Яр та УНР (1918)</button>
            </div>
        </div>
    </div>

    <div id="history-modal" class="overlay hidden">
        <div class="parchment">
            <h2 id="history-title">Історична довідка</h2>
            <p id="history-text"></p>
            <button onclick="closeHistory()">До бою!</button>
        </div>
    </div>

    <div id="end-modal" class="overlay hidden">
        <div class="parchment">
            <h2 id="end-title">Бій завершено</h2>
            <p id="end-text"></p>
            <button onclick="returnToMenu()">В табір (Меню)</button>
        </div>
    </div>

    <div id="hud" class="hidden">
        <div class="hud-left">
            <div id="hp-bar">❤️❤️❤️</div>
            <div id="epoch-label">Епоха I</div>
        </div>
        <div class="hud-right">
            <span id="knife-count">🗡️ Ножі: 2</span>
            <span id="pistol-ammo">🔫 Пістоль: немає</span>
            <button class="menu-btn" onclick="returnToMenu()">☰</button>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="mobile-controls" class="hidden">
        <div class="dpad">
            <button id="btn-left">◀</button>
            <button id="btn-right">▶</button>
            <div class="ladder-btns">
                <button id="btn-up">▲</button>
                <button id="btn-down">▼</button>
            </div>
        </div>
        <div class="actions">
            <button id="btn-knife" class="act-btn">🗡️<small>Ніж</small></button>
            <button id="btn-pistol" class="act-btn">🔫<small>Пістоль</small></button>
            <button id="btn-saber" class="act-btn main-act">⚔️<small>Шабля</small></button>
            <button id="btn-jump" class="act-btn jump-act">⬆️<small>Стрибок</small></button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
