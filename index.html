<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Козак Трай — Гра</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="rotate-screen" class="rotate-overlay" aria-live="polite">
    <div class="rotate-card">
      <div class="rotate-icon">↻</div>
      <h2>Переверніть телефон</h2>
      <p>Для комфортної гри поверніть пристрій у горизонтальне положення.</p>
    </div>
  </div>

  <div id="game-wrap" class="game-wrap">
    <canvas id="gameCanvas" width="1280" height="720"></canvas>

    <div class="hud-top">
      <div class="hud-pill" id="hud-hp">HP: 100</div>
      <div class="hud-pill" id="hud-era">Епоха: Козаччина</div>
      <div class="hud-pill" id="hud-score">Очки: 0</div>
    </div>

    <div class="controls-layer">
      <div class="move-pad">
        <button type="button" id="btn-left" class="ctrl-btn" aria-label="Вліво">◀</button>
        <button type="button" id="btn-right" class="ctrl-btn" aria-label="Вправо">▶</button>
      </div>
      <div class="action-pad">
        <button type="button" id="btn-jump" class="ctrl-btn" aria-label="Стрибок">▲</button>
        <button type="button" id="btn-attack" class="ctrl-btn ctrl-btn--accent" aria-label="Атака">⚔</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
